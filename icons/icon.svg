<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0fdf4"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>

  <!-- Grocery Cart & Badge Illustration -->
  <g filter="url(#dropShadow)" transform="translate(40, 40)">
    <!-- Cart Body -->
    <path d="M72 80 H120 L158 260 C162 278 178 290 196 290 H344 C362 290 378 278 382 260 L408 140 H140" 
          fill="none" stroke="url(#cartGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart Grid Lines -->
    <line x1="180" y1="170" x2="385" y2="170" stroke="url(#cartGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <line x1="195" y1="220" x2="365" y2="220" stroke="url(#cartGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <line x1="230" y1="140" x2="220" y2="280" stroke="url(#cartGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    <line x1="300" y1="140" x2="295" y2="280" stroke="url(#cartGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
    
    <!-- Wheels -->
    <circle cx="200" cy="340" r="26" fill="#ffffff"/>
    <circle cx="200" cy="340" r="10" fill="#059669"/>
    <circle cx="340" cy="340" r="26" fill="#ffffff"/>
    <circle cx="340" cy="340" r="10" fill="#059669"/>

    <!-- Green Leaf / Check Shield Badge (Smart / Fresh) -->
    <circle cx="340" cy="100" r="44" fill="#3b82f6"/>
    <path d="M326 100 L336 110 L356 90" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
