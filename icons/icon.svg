<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="creamBrownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8C6239"/>
      <stop offset="100%" stop-color="#5E3D21"/>
    </linearGradient>
    <linearGradient id="trolleyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF6F0"/>
      <stop offset="100%" stop-color="#EDE0D4"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2C221E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle in warm aesthetic brown -->
  <rect width="512" height="512" rx="112" fill="url(#creamBrownGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="rgba(250,246,240,0.25)" stroke-width="4"/>

  <!-- Grocery Cart / Trolley Illustration -->
  <g filter="url(#dropShadow)" transform="translate(40, 40)">
    <!-- Cart Body -->
    <path d="M72 80 H120 L158 260 C162 278 178 290 196 290 H344 C362 290 378 278 382 260 L408 140 H140" 
          fill="none" stroke="url(#trolleyGrad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Cart Grid Lines -->
    <line x1="180" y1="170" x2="385" y2="170" stroke="url(#trolleyGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <line x1="195" y1="220" x2="365" y2="220" stroke="url(#trolleyGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <line x1="230" y1="140" x2="220" y2="280" stroke="url(#trolleyGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    <line x1="300" y1="140" x2="295" y2="280" stroke="url(#trolleyGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
    
    <!-- Wheels -->
    <circle cx="200" cy="340" r="26" fill="#FAF6F0"/>
    <circle cx="200" cy="340" r="10" fill="#5E3D21"/>
    <circle cx="340" cy="340" r="26" fill="#FAF6F0"/>
    <circle cx="340" cy="340" r="10" fill="#5E3D21"/>

    <!-- Gold / Caramel Shield Badge (Budget Safety) -->
    <circle cx="340" cy="100" r="44" fill="#DDB892"/>
    <path d="M326 100 L336 110 L356 90" fill="none" stroke="#2C221E" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>